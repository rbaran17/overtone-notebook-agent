name: Feature request
description: Suggest a change or addition to Overtone
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like Overtone to do?

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend / API
        - CLI
        - Web UI
        - TypeScript client
        - Live voice
        - Docs
